[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-forecasting-engine"
version = "0.1.0"
description = "Leakage-resistant one-session-ahead variance and VaR forecasting research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dharmashekhar Chauhan" },
]
dependencies = [
    "arch>=7.2,<8",
    "historical-asset-risk-engine @ git+https://github.com/SIRE02/historical-asset-risk-engine.git@f8a1b91b3f3e1e74040c232d8841397d0f032508",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
market-risk-forecast = "market_risk_forecasting.cli:main"

[project.urls]
Repository = "https://github.com/SIRE02/market-risk-forecasting-engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".pytest_tmp",
    ".venv",
    "build",
    "dist",
    "docs/market-risk-forecasting-engine-implementation-spec.md",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_tmp"
testpaths = ["tests"]
