name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy src
      - name: Tests
        run: python -m pytest -q
      - name: Package
        run: python -m build

