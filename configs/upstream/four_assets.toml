[analysis]
provider = "yahoo"
tickers = ["AAPL", "MSFT", "GLD", "TLT"]
start_date = "2010-01-01"
end_date = "2026-01-01"
rolling_window = 252
rolling_min_observations = 252
observations_per_year = 252
quantiles = [0.05, 0.25, 0.75, 0.95]
quantile_method = "linear"
downside_target = 0.0
output_dir = "data/upstream/aapl-msft-gld-tlt-2010-2025"
