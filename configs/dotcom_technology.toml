[experiment]
experiment_id = "risk-dotcom-technology"
input_run_dir = "data/upstream/spy-msft-csco-aapl-1993-2026"
output_dir = "outputs/risk-dotcom-technology"
random_seed = 42

[upstream]
project = "historical-asset-risk-engine"
package_version = "0.1.1"
simple_returns_schema_id = "historical-asset-risk/simple-returns"
simple_returns_schema_version = "1.experimental"
simple_returns_units = "decimal_return_per_observation"
instruments = ["SPY", "MSFT", "CSCO", "AAPL"]

[periods]
development_start = "1998-01-01"
development_end = "1998-06-30"
validation_start = "1998-07-01"
validation_end = "1998-12-31"
test_start = "1999-01-01"
test_end = "2026-07-31"

[portfolio_proxy]
enabled = false

[historical]
variance_window = 252
var_window = 500
quantile_method = "linear"

[ewma]
lambda = 0.94
initialization_window = 252

[garch]
estimation_window = 1250
refit_every_origins = 20
input_scale = 100.0
retry_count = 1
stationarity_tolerance = 1e-8

[evaluation]
bootstrap_block_length = 20
bootstrap_resamples = 2000
bootstrap_confidence = 0.95
